[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-qa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.12.5,<3",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
